# ────── API & Server ──────────────────────────────────────────
api:
  base-path: /api/v1

server:
  port: 0

# ── Service Discovery ─────────────────────────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# ── Spring Boot Core ──────────────────────────────────────────
spring:
  application:
    name: search-service-test

  # ── Elasticsearch (Testcontainers / Embedded Override) ────────
  elasticsearch:
    uris: http://localhost:9200

  # ── Security & OAuth2 ─────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/dummy

  # ── Kafka Messaging ─────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092

    listener:
      concurrency: 1
      ack-mode: manual_immediate

    properties:
      schema.registry.url: http://localhost:8081
      value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy
      auto.register.schemas: false
      use.latest.version: true

    consumer:
      group-id: test-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
        derive.type: true

# ── Actuator Management ───────────────────────────────────────
management:
  server:
    port: 0

# ── Search Configuration ──────────────────────────────────────
search:
  default-page-size: 20
  max-page-size: 100
  highlight:
    pre-tag: "<mark>"
    post-tag: "</mark>"

# ── Messaging Topics ──────────────────────────────────────────
kafka:
  topics:
    job:
      job-events: test.topic

# ── Application Security ──────────────────────────────────────
app:
  security:
    hmac:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970