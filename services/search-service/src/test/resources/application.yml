api:
  base-path: /api/v1

server:
  port: 0

spring:
  application:
    name: search-service-test
  elasticsearch:
    uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/dummy

management:
  server:
    port: 0

search:
  default-page-size: 20
  max-page-size: 100
  highlight:
    pre-tag: "<mark>"
    post-tag: "</mark>"

kafka:
  topics:
    job:
      job-events: test.topic

app:
  security:
    hmac:
      secret: test-secret-key-for-hmac-signing