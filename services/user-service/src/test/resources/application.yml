# ────── Server ──────────────────────────────────────────────
server:
  port: 0

# ── gRPC Configuration ─────────────────────────────────────
grpc:
  server:
    port: 0
    address: 0.0.0.0

# ── Service Discovery ─────────────────────────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true

# ── Spring Boot Core ──────────────────────────────────────────
spring:
  application:
    name: user-service

  # ── Database (Testcontainers PostgreSQL Override) ────────────
  datasource:
    hikari:
      pool-name: HikariPool-user-test
    url: jdbc:postgresql://localhost:5432/testdb
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ── Database Migration (Flyway) ─────────────────────────────
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: true

  # ── Security & OAuth2 ─────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/issuer

  # ── Kafka Messaging ─────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group

kafka:
  topics:
    auth:
      user-events: jobboard.events.auth

# ── Application Security ──────────────────────────────────────
app:
  security:
    hmac:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ── Third-Party Integrations ─────────────────────────────────
cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret