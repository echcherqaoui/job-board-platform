# ── Server ──────────────────────────────────────────────────
server:
  port: ${USER_SERVICE_PORT}

# ── gRPC Clients ──────────────────────────────────────────────
grpc:
  server:
    port: ${USER_SERVICE_GRPC_PORT}
    address: 0.0.0.0

# ── Service Discovery ─────────────────────────────────────────
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    metadata-map:
      gRPC_port: ${USER_SERVICE_GRPC_PORT}

  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL}

# ── Spring Boot Core ──────────────────────────────────────────
spring:
  application:
    name: user-service

# ── Database (PostgreSQL/JPA) ───────────────────────────────
  datasource:
    hikari:
      pool-name: HikariPool-auth
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# ── Database Migration (Flyway) ─────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      outbox_publication_name: user_outbox_publication

# ── Security  ───────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

# ── Kafka Messaging ─────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KF_BOOTSTRAP_SERVERS}
    properties:
      schema.registry.url: ${SC_REGISTRY_URL}
      value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy
      auto.register.schemas: false
      use.latest.version: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

    consumer:
      group-id: ${KF_CONSUMER_GROUP_ID}
      auto-offset-reset: ${KF_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
        specific.protobuf.value.type: com.echcherqaoui.jobboard.event.UserCreatedEvent

# ── User Config ─────────────────────────────────────────────
kafka:
  topics:
    auth:
      job-seeker-registered: auth.user.job-seeker-registered
      recruiter-registered: auth.user.recruiter-registered

app:
  security:
    hmac:
      secret: ${HMAC_SECRET_KEY}