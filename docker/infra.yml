services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: postgres-job-board
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${PG_INIT_PATH}:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - job-board-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    command: [
      "postgres",
      "-c", "wal_level=logical",
      "-c", "max_connections=101"
    ]

  redis:
    image: redis:${RD_VERSION}
    container_name: redis-job-board
    ports:
      - "${RD_PORT}:6379"
    environment:
      REDIS_PASSWORD: ${RD_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - job-board-net
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-raw ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    command: [
      "redis-server",
      "--requirepass", "${RD_PASSWORD}",
      "--appendonly", "yes"
    ]

networks:
  job-board-net:
    driver: bridge
    name: job-board-net

volumes:
  postgres_data:
  redis_data: