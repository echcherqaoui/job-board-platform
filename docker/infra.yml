services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: postgres-job-board
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${PG_INIT_PATH}:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - job-board-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    command: [
      "postgres",
      "-c", "wal_level=logical",
      "-c", "max_connections=101"
    ]

  redis:
    image: redis:${RD_VERSION}
    container_name: redis-job-board
    ports:
      - "${RD_PORT}:6379"
    environment:
      REDIS_PASSWORD: ${RD_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - job-board-net
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-raw ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    command: [
      "redis-server",
      "--requirepass", "${RD_PASSWORD}",
      "--appendonly", "yes"
    ]

  kafka-0:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION}
    container_name: kafka-job-board
    ports:
      - "${KF_PORT}:${KF_PORT}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      CLUSTER_ID: ${KF_CLUSTER_ID}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:${KF_CONTROLLER_PORT}

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:${KF_INTERNAL_PORT},EXTERNAL://0.0.0.0:${KF_PORT},CONTROLLER://0.0.0.0:${KF_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-0:${KF_INTERNAL_PORT},EXTERNAL://${KF_HOST}:${KF_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KF_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KF_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KF_REPLICATION_FACTOR}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-0_data:/var/lib/kafka/data
    networks:
      - job-board-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${KF_INTERNAL_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION}
    container_name: schema-registry-job-board
    ports:
      - "${SC_REGISTRY_PORT}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka-0:${KF_INTERNAL_PORT}"
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - job-board-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      kafka-0:
        condition: service_healthy
    restart: unless-stopped

  connect:
    build:
      context: .
      dockerfile: kafka-connect.Dockerfile
      args:
        CONFLUENT_VERSION: ${CONFLUENT_VERSION}
        DEBEZIUM_VERSION: ${DEBEZIUM_VERSION}
    container_name: connect-job-board
    ports:
      - "${KF_CONNECT_PORT}:8083"
    environment:
      CONNECT_LOG4J_LOGGERS: "org.apache.kafka.connect.runtime.TransformationChain=TRACE,io.debezium.transforms.outbox=TRACE"
      CONNECT_BOOTSTRAP_SERVERS: "kafka-0:${KF_INTERNAL_PORT}"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: compose-connect-group

      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: ${KF_REPLICATION_FACTOR}
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: ${KF_REPLICATION_FACTOR}
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: ${KF_REPLICATION_FACTOR}
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "io.confluent.connect.protobuf.ProtobufConverter"
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: ${SC_REGISTRY_URL}

      CONNECT_PLUGIN_PATH: "/usr/share/confluent-hub-components"
    networks:
      - job-board-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/connector-plugins" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      kafka-0:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    container_name: elasticsearch-job-board
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=jobboard-cluster
    networks:
      - job-board-net
    healthcheck:
      test: curl -sf http://localhost:9200/_cluster/health | grep -v '"status":"red"'
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

networks:
  job-board-net:
    driver: bridge
    name: job-board-net

volumes:
  postgres_data:
  redis_data:
  kafka-0_data:
    driver: local
  elasticsearch_data:
    driver: local