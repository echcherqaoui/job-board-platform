syntax = "proto3";

package user;

option java_package = "com.echcherqaoui.jobboard.user.grpc";
option java_outer_classname = "UserProfileProto";

option java_multiple_files = true;

service UserProfileService {
  rpc GetCompanyProfileById(GetProfileByIdRequest)     returns (CompanyProfileGrpc);
}

// ── Requests ─────────────────────────────────────────────────
message GetProfileByIdRequest {
  string profile_id = 1;
}

// ── Responses ────────────────────────────────────────────────
message CompanyProfileGrpc {
  string company_name = 1;
  string logo_url = 2;
}
