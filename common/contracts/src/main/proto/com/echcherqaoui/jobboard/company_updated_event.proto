syntax = "proto3";

package com.echcherqaoui.jobboard;

option java_package = "com.echcherqaoui.jobboard.event";
option java_outer_classname = "CompanyUpdatedEventProto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message CompanyUpdatedEvent {
  string event_id = 1;
  string recruiter_id = 2;
  string company_name = 3;
  string company_logo = 4;
  string signature = 5;
  google.protobuf.Timestamp occurred_at = 6;
}