syntax = "proto3";

package com.echcherqaoui.jobboard;

option java_package = "com.echcherqaoui.jobboard.event";
option java_outer_classname = "JobDeletedEventProto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message JobDeletedEvent {
  string event_id = 1;
  string job_id = 2;
  string recruiter_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string signature = 5;
}