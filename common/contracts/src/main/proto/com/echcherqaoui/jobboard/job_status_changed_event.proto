syntax = "proto3";

package com.echcherqaoui.jobboard;

option java_package = "com.echcherqaoui.jobboard.event";
option java_outer_classname = "JobStatusChangedEventProto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message JobStatusChangedEvent {
  string event_id = 1;
  string job_id = 2;
  string recruiter_id = 3;
  string status = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string signature = 6;
}