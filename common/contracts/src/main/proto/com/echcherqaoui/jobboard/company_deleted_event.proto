syntax = "proto3";

package com.echcherqaoui.jobboard;

option java_package = "com.echcherqaoui.jobboard.event";
option java_outer_classname = "CompanyDeletedEventProto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message CompanyDeletedEvent {
  string event_id = 1;
  string recruiter_id = 2;
  string signature = 3;
  google.protobuf.Timestamp occurred_at = 4;
}