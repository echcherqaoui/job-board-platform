syntax = "proto3";

package jobboard.auth.event;

option java_package = "com.echcherqaoui.jobboard.auth.event";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message JobSeekerRegisteredEvent {
  string event_id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string signature = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

message RecruiterRegisteredEvent {
  string event_id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string signature = 6;
  google.protobuf.Timestamp occurred_at = 7;
}